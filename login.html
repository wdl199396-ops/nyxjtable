<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 进件质量督导工作台</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--line:#e6e9ef;--text:#1f2733;--muted:#8a93a3;--primary:#2f6fed;--danger:#e23b3b;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
  h1{font-size:19px;margin:0 0 4px;color:#0f1b33}
  .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}
  input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  button{width:100%;font-size:16px;padding:12px;border:none;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;min-height:46px}
  button:disabled{opacity:.6}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}
</style>
</head>
<body>
<div class="box">
  <h1>进件质量督导工作台</h1>
  <div class="sub">请使用负责人分配的登录名与密码</div>
  <label>登录名（邮箱格式）</label>
  <input type="email" id="email" autocomplete="username">
  <label>密码</label>
  <input type="password" id="pw" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button id="btn">登 录</button>
</div>
<script src="config.js"></script>
<script src="wbcloud.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn'), err = document.getElementById('err');
  var s = window.wbSession();
  if (s && s.user) { location.replace('index.html'); return; }
  function go() {
    btn.disabled = true; err.textContent = '登录中…';
    window.wbLogin(document.getElementById('email').value.trim(), document.getElementById('pw').value)
      .then(function () { location.replace('index.html'); })
      .catch(function (e) { err.textContent = '登录失败：' + e.message; btn.disabled = false; });
  }
  btn.addEventListener('click', go);
  document.getElementById('pw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
})();
</script>
</body>
</html>
