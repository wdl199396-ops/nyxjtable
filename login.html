<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 进件质量督导工作台</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--line:#e6e9ef;--text:#1f2733;--muted:#8a93a3;--primary:#2f6fed;--primary-d:#1f56c4;--danger:#e23b3b;--shadow:0 1px 3px rgba(20,30,50,.08),0 4px 16px rgba(20,30,50,.06);--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
  h1{font-size:19px;margin:0 0 4px;color:#0f1b33}
  .sub{font-size:13px;color:var(--muted);margin-bottom:22px}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}
  input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  button{width:100%;font-size:16px;padding:12px;border:none;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;min-height:46px}
  button:disabled{opacity:.6}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}
  .tip{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <h1>进件质量督导工作台</h1>
  <div class="sub">总部信贷审批 · 请使用管理员分配的账号登录</div>
  <label>邮箱</label>
  <input type="email" id="email" placeholder="you@company.com" autocomplete="username">
  <label>密码</label>
  <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button id="btn">登 录</button>
  <div class="tip">账号由总部负责人创建并分配角色；登录后按角色自动进入对应工作台。数据云端存储、多人实时同步。</div>
</div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
(function () {
  var btn = document.getElementById('btn'), err = document.getElementById('err');
  function go() {
    btn.disabled = true; err.textContent = '登录中…';
    sb.signIn(document.getElementById('email').value.trim(), document.getElementById('pw').value)
      .then(sb.getProfile)
      .then(function (prof) {
        if (!prof) throw new Error('该账号尚未分配角色，请联系负责人配置');
        location.replace('index.html');
      })
      .catch(function (e) { err.textContent = '登录失败：' + e.message; btn.disabled = false; });
  }
  btn.addEventListener('click', go);
  document.getElementById('pw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
  if (sbSession.get()) { sb.getProfile().then(function (p) { if (p) location.replace('index.html'); }); }
})();
</script>
</body>
</html>
